[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faulty-oversight-shift"
version = "0.1.0"
description = "A controlled in-context experiment on shifts induced by systematically faulty evaluator feedback."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Faulty Oversight Shift contributors" }]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
oversight-study = "oversight_study.cli:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scipy>=1.17.1",
]
api = [
    "anthropic>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
