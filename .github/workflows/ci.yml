name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    env:
      NO_PAID_RUNS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check
      - run: uv run oversight-study status
      - run: uv run oversight-study smoke
      - run: uv run python -m unittest discover -s tests
